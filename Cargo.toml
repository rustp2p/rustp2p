[workspace]
resolver = "2"
members = ["rustp2p-core", "rustp2p-quic"]

[workspace.dependencies]
rustp2p-core = { path = "rustp2p-core", version = "0.2.0" }
tokio = { version = "1.42", features = ["full"] }
log = "0.4"
parking_lot = "0.13"
bytes = "1.9"
dashmap = "6.1"
rand = "0.10"
flume = { version = "0.12", features = ["async"] }
